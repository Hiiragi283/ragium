[versions]
minecraft = "26.3"

neo-moddev = "2.0.148"
neo-version = "26.3.0.95"
kff-version = "6.4.0"

kotlin = "2.4.21"
dokka = "2.2.0"
spotless = "8.10.4"

axion-release = "1.21.4"
maven-publish = "0.37.0"
mod-publish = "2.1.1"

ae2 = "26.3.1-alpha"
curios = "17.0.0-beta.3+26.3"
jade = "26.3.5+neoforge"
jei = "31.16.0.87"

[libraries]

kff = { group = "thedarkcolour", name = "kotlinforforge-neoforge", version.ref = "kff-version" }

ae2 = { group = "org.appliedenergistics", name = "appliedenergistics2", version.ref = "ae2" }
curios = { group = "top.theillusivec4.curios", name = "curios-neoforge", version.ref = "curios" }
jade = { group = "maven.modrinth", name = "jade", version.ref = "jade" }
jei = { group = "mezz.jei", name = "jei-26.3-neoforge", version.ref = "jei" }
jei-api = { group = "mezz.jei", name = "jei-26.3-neoforge-api", version.ref = "jei" }

[bundles]

common-impl = []

common-compile = []

common-runtime = [
    "ae2",
    "curios",
]

[plugins]

neo-moddev = { id = "net.neoforged.moddev", version.ref = "neo-moddev" }

kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
dokka = { id = "org.jetbrains.dokka", version.ref = "dokka" }
dokka-javadoc = { id = "org.jetbrains.dokka-javadoc", version.ref = "dokka" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }

axion-release = { id = "pl.allegro.tech.build.axion-release", version.ref = "axion-release" }
maven-publish = { id = "com.vanniktech.maven.publish", version.ref = "maven-publish" }
mod-publish = { id = "me.modmuss50.mod-publish-plugin", version.ref = "mod-publish" }
